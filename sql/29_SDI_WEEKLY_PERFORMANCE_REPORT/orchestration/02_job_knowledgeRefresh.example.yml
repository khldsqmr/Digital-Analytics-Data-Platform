          # Internally: Track A facts → Bronze APP_SYNC → Silver → physical Gold REFRESH
        - task_key: gold_ai_enrichment
          depends_on: [{task_key: sql_layers}]
          # NOTEBOOK: trackB/gold/02_sdi_nb_weeklyNarrative_gold_aiEnrichment_perRun.py
          # Pass week_end, ai_enabled=true, endpoint. Notebook calls Gold SP APPLY itself.
        - task_key: graph_extraction_and_persistence
          depends_on: [{task_key: gold_ai_enrichment}]
          # NOTEBOOK: knowledgeGraph/gold/03_sdi_nb_weeklyNarrative_gold_extractKnowledgeGraph_perRun.py
          # The notebook CALLs Nodes SP then Edges SP, using validated JSON batches.
        - task_key: validation
          depends_on: [{task_key: graph_extraction_and_persistence}]
          # SQL validation: Track B Gold eligibility reconciliation + graph referential integrity
          # No approval is implied by an AI extraction run.
